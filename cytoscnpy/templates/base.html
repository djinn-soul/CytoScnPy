<!DOCTYPE html>
<html lang="en" class="no-js"{% block html_attrs %}{% endblock %}>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>CytoScnPy Report</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="{{ root_path }}/css/style.css" />
    <script src="{{ root_path }}/js/theme.js"></script>
    {% block head %}{% endblock %}
  </head>
  <body>
    <nav class="site-nav">
      <div class="container nav-content">
        <a href="{{ root_path }}/index.html" class="logo">CytoScnPy</a>
        <div class="nav-right">
          <div class="nav-links">
            {% block nav_links %}
            <a href="{{ root_path }}/index.html">Dashboard</a>
            <a href="{{ root_path }}/issues.html">Issues</a>
            <a href="{{ root_path }}/clones.html">Clones</a>
            <a href="{{ root_path }}/files.html">Files</a>
            <a href="{{ root_path }}/deslop.html">Deslop</a>
            {% endblock %}
          </div>
          <button
            type="button"
            id="theme-toggle"
            class="theme-toggle"
            aria-label="Toggle color theme"
            title="Toggle color theme"
          >
            <svg
              class="icon-sun"
              xmlns="http://www.w3.org/2000/svg"
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <circle cx="12" cy="12" r="4" />
              <path
                d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"
              />
            </svg>
            <svg
              class="icon-moon"
              xmlns="http://www.w3.org/2000/svg"
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
            </svg>
          </button>
        </div>
      </div>
    </nav>
    <main class="container">{% block content %}{% endblock %}</main>
    <footer class="container report-footer">
      Generated by CytoScnPy {{ version }} at {{ generated_at }}
    </footer>
  </body>
</html>
