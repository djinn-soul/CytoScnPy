[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "cytoscnpy"
description = "High-performance dead code elimination analysis tool for Python."
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]
readme = "README.md"

dynamic = ["version"]



[tool.maturin]
bindings = "pyo3"
strip = true
module-name = "cytoscnpy"
python-source = "python"
manifest-path = "cytoscnpy/Cargo.toml"
features = ["python-bindings"]


[project.scripts]
cytoscnpy = "cytoscnpy.cli:main"

[project.optional-dependencies]
pytest = ["pytest>=7.0"]

[project.entry-points."pytest11"]
cytoscnpy = "cytoscnpy.pytest_plugin"

[tool.pytest.ini_options]
testpaths = ["python/tests", "benchmark/tests"]
addopts = ""

[tool.ruff]
# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
    # Project specific excludes
    "benchmark/examples",
    "benchmark/test_corpus",
    "cytoscnpy/tests/data",
    "cytoscnpy/tests/python_files",
    "cytoscnpy/tests/taint_corpus.py",
    "cytoscnpy/tests/reproduce_type_error.py",
]
line-length = 88
indent-width = 4
target-version = "py38"
src = ["python", "benchmark"]

[tool.ruff.lint]
# Enable Pyflakes (`F`), subset of pycodestyle (`E`), and pydocstyle (`D`) codes.
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "UP",
    "S",
    "D",
    "ANN",
    "RUF",
    "BLE",
    "C90",
    "ARG",
    "PTH",
    "ERA",
    "COM",
    "DTZ",
    "T10",
    "T20",
    "EXE",
    "ISC",
    "ICN",
    "LOG",
    "G",
    "PIE",
    "PYI",
    "Q",
    "RSE",
    "RET",
    "SLF",
    "SLOT",
    "TID",
    "INT",
    "FLY",
    "PERF",
    "FURB",
    "N",
    "ASYNC",
    "FBT",
]
ignore = [
    "E501",   # Line too long
    "COM812", # Trailing comma
    "ISC001", # Implicit string concat
    "D100",   # Missing docstring in public module
    "D104",   # Missing docstring in public package
]

[tool.ruff.lint.per-file-ignores]
"benchmark/**/*" = ["S", "D", "ANN", "T20", "INP", "EXE001"]
"python/tests/**/*" = [
    "S101",
    "D",
    "ANN",
    "PLR2004",
    "ARG",
    "T201",
    "BLE",
    "SLF",
]
"benchmark/tests/**/*" = [
    "S101",
    "D",
    "ANN",
    "PLR2004",
    "ARG",
    "T201",
    "BLE",
    "SLF",
]
"scripts/**/*" = ["T201", "INP", "S", "ANN"]
"cytoscnpy-mcp/**/*" = ["T201", "INP", "S", "ANN", "ARG"]

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"


[tool.coverage.report]
fail_under = 80
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.poe.executor]
type = "uv"

[tool.uv]
package = false

[tool.poe.tasks]
build = { cmd = "uv sync", help = "Build the Rust extension and sync dependencies" }
sync = { cmd = "uv sync", help = "Alias for build" }
format = { sequence = [
    { cmd = "ruff format ." },
    { cmd = "ruff check . --fix" },
], help = "Format code with ruff" }
lint = { cmd = "ruff check .", help = "Lint code with ruff" }
typecheck = { cmd = "basedpyright", help = "Type check with basedpyright" }
security = { sequence = [
    { cmd = "pip-audit" },
], help = "Run security audits" }
test = { cmd = "pytest --cov=python/cytoscnpy --cov-report=term-missing", help = "Run tests with coverage" }
quality = { sequence = [
    "format",
    "typecheck",
    "security",
    "test",
], help = "Run all quality checks" }

[tool.ty.src]
# Exclude test data directories that contain intentionally broken code
exclude = [
    "benchmark",
    "scripts",
    "cytoscnpy/tests/data",
    "cytoscnpy/tests/python_files",
    "cytoscnpy/tests/taint_corpus.py",
    "cytoscnpy/tests/reproduce_type_error.py",
]

[dependency-groups]
dev = [
    "basedpyright>=1.37.3",
    "maturin>=1.0,<2.0",
    "mkdocs>=1.6.1,<2.0.0",
    "mkdocs-material>=9.7.2",
    "pip-audit>=2.7.3",
    "poethepoet>=0.30.0",
    "prek",
    "psutil>=7.2.2",
    "pytest>=9.0.3",
    "pytest-cov>=7.0.0",
    "ruff",
    "tomli; python_version < '3.11'",
    "trove-classifiers",
    "ty",
]
docs = [
    "mkdocs>=1.6.1,<2.0.0",
    "mkdocs-material>=9.5.0; python_version >= '3.9'",
    "mkdocs-minify-plugin>=0.8.0; python_version >= '3.9'",
    "mkdocstrings[python]>=0.24.0",
    "pymdown-extensions>=10.0; python_version >= '3.9'",
]




# ============================================================
[tool.basedpyright]
include = ["python/cytoscnpy"]
typeCheckingMode = "strict"
reportMissingImports = true
reportMissingTypeStubs = true  # Stricter: require type stubs
reportUndefinedVariable = true
reportAssertAlwaysTrue = true
reportInvalidStringEscapeSequence = true

# ============================================================
reportOptionalSubscript = true
reportOptionalMemberAccess = true
reportOptionalCall = true
reportOptionalIterable = true
reportOptionalContextManager = true
reportOptionalOperand = true
reportAny = true  # Prohibir Any completamente
reportExplicitAny = true
reportIgnoreCommentWithoutRule = false  # No permitir # type: ignore sin código
reportPrivateLocalImportUsage = true

# ============================================================
reportMissingParameterType = true
reportMissingTypeArgument = true
reportUnknownParameterType = true
reportUnknownLambdaType = true
reportUnknownArgumentType = true   # STRICT: Enable (can be noisy)
reportUnknownVariableType = true   # STRICT: Enable (can be noisy)
reportUnknownMemberType = true     # STRICT: Enable (can be noisy)
reportUntypedFunctionDecorator = true
reportUntypedClassDecorator = true
reportUntypedBaseClass = true
reportUntypedNamedTuple = true

# ============================================================
reportIncompatibleMethodOverride = true
reportIncompatibleVariableOverride = true
reportInconsistentConstructor = true
reportUninitializedInstanceVariable = true
reportOverlappingOverload = true
reportMissingSuperCall = true  # STRICT: Enable

# ============================================================
reportPrivateUsage = true
reportConstantRedefinition = true
reportInvalidStubStatement = true
reportIncompleteStub = true
reportUnsupportedDunderAll = true
reportUnusedClass = "error"        # STRICT: Error instead of warning
reportUnusedFunction = "error"     # STRICT: Error instead of warning
reportUnusedVariable = "error"     # STRICT: Error instead of warning
reportUnusedImport = "error"       # STRICT: Error instead of warning
reportDuplicateImport = "error"    # STRICT: Error instead of warning

# ============================================================
reportUnnecessaryIsInstance = "error"         # STRICT: Error
reportUnnecessaryCast = "error"               # STRICT: Error
reportUnnecessaryComparison = "error"         # STRICT: Error
reportUnnecessaryContains = "error"           # STRICT: Error
reportUnnecessaryTypeIgnoreComment = "error"  # STRICT: Error

# ============================================================
reportGeneralTypeIssues = true
reportPropertyTypeMismatch = true
reportFunctionMemberAccess = true
reportCallInDefaultInitializer = true
reportImplicitStringConcatenation = true  # STRICT: Enable

# ============================================================
reportImplicitOverride = true    # STRICT: Require @override decorator (Python 3.12+)
reportDeprecated = "warning"     # Warn on deprecated usage

# ============================================================
reportImportCycles = "warning"

# ============================================================
exclude = [
    "**/__pycache__",
    "**/node_modules",
    ".git",
    ".mypy_cache",
    ".pyright_cache",
    ".ruff_cache",
    ".pytest_cache",
    ".venv",
    "venv",
    "env",
    "logs",
    "output",
    "data",
    "build",
    "dist",
    "*.egg-info",
     "benchmark/examples",
    "benchmark/test_corpus",
    "benchmark/tests",
    "test_repo",
    "python/tests",
    "cytoscnpy-mcp/scripts",
    "security_example",
    "cytoscnpy/tests",
    "scripts",
    "benchmark",
    "**/target",
    "**/node_modules",
    "**/__pycache__",
]

venvPath = "."
venv = ".venv"
pythonVersion = "3.10"

[tool.cytoscnpy]

# ── Core ──────────────────────────────────────────────────────────────────────

# Minimum confidence score (0-100) a finding must reach before it is reported.
# Lower values surface more findings; higher values reduce noise.
# confidence = 60

# Scan for hard-coded secrets and high-entropy strings (API keys, tokens, etc.).
# secrets = true

# Scan for dangerous code patterns: SQL injection, XSS, command injection, etc.
# danger = true

# Report code-quality issues: high complexity, deep nesting, long functions, etc.
# quality = true

# Include pytest/unittest test files in the analysis.
# include_tests = false

# Include Jupyter notebook (.ipynb) cells in the analysis.
# include_ipynb = false

# How the project is used externally.
# "library"     – public symbols are assumed to be part of the API (fewer false positives).
# "application" – reduces public-API assumptions; stricter dead-code detection.
# project_type = "library"


# ── Quality thresholds ────────────────────────────────────────────────────────

# McCabe cyclomatic complexity limit per function. Exceeding this is a finding.
# max_complexity = 10

# Maximum nesting depth (if/for/while/try) before a finding is emitted.
# max_nesting = 3

# Maximum number of parameters a function may have.
# max_args = 5

# Maximum number of lines a function body may span.
# max_lines = 50

# Minimum Maintainability Index (0-100). Functions below this score are flagged.
# min_mi = 40.0


# ── Path filters ──────────────────────────────────────────────────────────────

# Directories to skip entirely during analysis.
# exclude_folders = ["build", "dist", ".venv", ".git", "__pycache__", ".mypy_cache", ".pytest_cache"]

# Directories to force-include even when they are git-ignored.
# include_folders = ["src"]


# ── Rule suppression ──────────────────────────────────────────────────────────

# Rule IDs to silence globally across the entire project.
# ignore = ["CSP-P003"]

# Silence specific rules only for files matching a glob pattern.
# Use a real table (not an inline `{ ... }`) so it can span multiple lines
# and hold as many glob -> rule-list entries as you need:
# [tool.cytoscnpy.per-file-ignores]
# "tests/*" = ["CSP-D701"]
# "**/__init__.py" = ["CSP-L001"]


# ── Clone detection ───────────────────────────────────────────────────────────

# Detect Type-1/2/3 duplicate code blocks across the project.
# clones = false

# How similar two blocks must be (0.0-1.0) to be reported as a clone pair.
# clone_similarity = 0.8


# ── CI/CD gate ────────────────────────────────────────────────────────────────

# Exit with code 1 when the percentage of unused definitions exceeds this value.
# fail_threshold = 5.0


# ── Inline whitelist ──────────────────────────────────────────────────────────
# Suppress specific dead-code symbols without a separate whitelist file.
# Each entry can target a single name, a wildcard pattern, or a regex.
# Add as many entries as you need in one array (each entry stays on its own
# line; only add commas between entries, not inside one):
# whitelist = [
#   { name = "my_unused_fn" },
#   { name = "test_*", pattern = "wildcard" },
#   { name = "legacy_handler", file = "src/api/*.py" },
# ]


# ── Secrets scanning (advanced) ───────────────────────────────────────────────

# [tool.cytoscnpy.secrets_config]
# # Shannon entropy threshold; strings above this score are flagged.
# entropy_threshold = 4.5
# # Minimum string length before entropy is evaluated.
# min_length = 16
# # Enable the entropy-based scanner (disable to use pattern-only mode).
# entropy_enabled = true
# # Also scan comments and docstrings for secrets.
# scan_comments = true
# # Skip triple-quoted docstrings during secret scanning.
# skip_docstrings = false
# # Combined confidence score threshold (0-100) for a secret finding.
# min_score = 50
# # Extra variable/parameter names that should be treated as suspicious.
# suspicious_names = []

# Add custom regex patterns for secret detection:
# [[tool.cytoscnpy.secrets_config.patterns]]
# # Human-readable name shown in findings.
# name = "My Token"
# # Regular expression to match.
# regex = "mytoken-[0-9a-zA-Z]{32}"
# # Severity level: LOW, MEDIUM, HIGH, or CRITICAL.
# severity = "HIGH"


# ── Danger / taint analysis (advanced) ───────────────────────────────────────

# [tool.cytoscnpy.danger_config]
# # Enable interprocedural taint tracking (data-flow from sources to sinks).
# enable_taint = true
# # Minimum severity to report: LOW, MEDIUM, HIGH, or CRITICAL.
# severity_threshold = "LOW"
# # Rule IDs to exclude from danger scanning.
# excluded_rules = []
# # Fully-qualified function names treated as taint sources.
# custom_sources = ["mylib.get_input"]
# # Fully-qualified function names treated as taint sinks.
# custom_sinks = ["mylib.exec_query"]
# # Functions that sanitize / clear taint on their return value.
# [tool.cytoscnpy.danger_config.sanitizers.ssrf]
# return_value = ["validate_allowed_url"]
# guard = ["is_allowed_url"]
# side_effect = ["validate_url_or_raise"]
